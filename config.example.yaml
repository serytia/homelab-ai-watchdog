# homelab-ai-watchdog configuration
# Copy to config.yaml, fill in, then: chmod 600 config.yaml
# Secrets can also come from environment variables (they override this file):
#   ANTHROPIC_API_KEY, PROXMOX_TOKEN_VALUE

proxmox:
  host: "192.168.1.10"        # Proxmox host or IP
  port: 8006
  user: "aiwatch@pve"         # dedicated user with the PVEAuditor role (read-only)
  token_name: "aiwatch"       # API token ID (Datacenter -> Permissions -> API Tokens)
  token_value: ""             # or set PROXMOX_TOKEN_VALUE in the environment
  verify_ssl: false           # false is common for self-signed PVE certs

triage:
  model: "claude-haiku-4-5"   # cheap eyes: pattern triage every run (~cents/day)
  deep_model: ""              # optional smart brain, e.g. "claude-opus-5":
                              # runs a 2nd diagnosis pass only when findings exist
  api_key: ""                 # prefer ANTHROPIC_API_KEY in the environment
  notify_min_severity: "warning"   # info | warning | critical
  # Zero-cloud mode (see README): triage on a local model, nothing leaves
  # your network. deep_model works here too (a bigger local model).
  # provider: "openai-compat"              # default: "anthropic"
  # base_url: "http://localhost:11434/v1"  # Ollama or any OpenAI-style server
  # model: "qwen3:8b"                      # required with openai-compat

# If the watchdog itself fails (API down, Proxmox unreachable), send the error
# through the notifiers instead of failing silently.
notify_on_watchdog_error: true

# An ongoing issue (a backup still failing) is re-notified at most once per
# this many hours — not on every 15-minute tick.
renotify_after_hours: 24

# v2 "hands": reply to the bot to run a SHORT whitelist of reversible actions.
# Uses a SECOND Proxmox token with a narrow role — never the auditor one:
#   pveum role add AIWatchOperator -privs "VM.PowerMgmt,VM.Audit"
#   pveum user add aiact@pve
#   pveum acl modify /vms/104 -user aiact@pve -role AIWatchOperator
#   pveum user token add aiact@pve aiact --privsep 0
responder:
  enabled: false
  allowed_vmids: []           # empty = no action commands at all (VMs and LXC)
  allowed_user_ids: []        # optional: pin commands to these Telegram user ids
  max_actions_per_hour: 6
  max_readonly_per_min: 4     # /status and /check are rate-limited too
  confirm_timeout_s: 60
  action_user: "aiact@pve"
  action_token_name: "aiact"
  action_token_value: ""      # or PROXMOX_ACTION_TOKEN_VALUE in the environment
# The responder only obeys your PRIVATE chat (never groups), drains any queued
# messages on restart without executing them, and audits to state/audit.jsonl.

state_file: "state/last_snapshot.json"

# Enable one or several. Each needs exactly one URL or token pair.
notifiers:
  telegram:
    enabled: false
    bot_token: ""             # from @BotFather
    chat_id: ""               # your chat id (message @userinfobot)
  discord:
    enabled: false
    webhook_url: ""           # channel settings -> Integrations -> Webhooks
  slack:
    enabled: false
    webhook_url: ""           # Slack app -> Incoming Webhooks
  teams:
    enabled: false
    workflow_url: ""          # Workflows app webhook URL (see README — classic
                              # O365 connector webhooks are retired since May 2026)
